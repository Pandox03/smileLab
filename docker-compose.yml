version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ceralis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ceralis
      MYSQL_USER: ceralis
      MYSQL_PASSWORD: ceralis
    ports:
      - "3307:3306"
    volumes:
      - ceralis_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ceralis-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8082:80"

volumes:
  ceralis_mysql_data:
